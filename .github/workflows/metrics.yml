name: Crônicas do perfil

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", "ferramentas/**", "dados/**"]

permissions:
  contents: write

jobs:
  cartoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Opcional: com um token da conta do estágio, a contagem dela também se atualiza sozinha.
      - if: ${{ env.VIRTUS_TOKEN != '' }}
        run: node ferramentas/guilda.mjs
        env:
          VIRTUS_TOKEN: ${{ secrets.VIRTUS_TOKEN }}
      - run: node ferramentas/cartoes.mjs
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets dados
          git diff --cached --quiet || (git commit -m "Reescreve as crônicas [skip ci]" && git push)
    env:
      VIRTUS_TOKEN: ${{ secrets.VIRTUS_TOKEN }}
